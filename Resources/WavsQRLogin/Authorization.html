<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{background:transparent;font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;color:#e9f3f7;width:800px}
.card{position:relative;width:800px;height:360px;overflow:hidden;
 clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,22px 100%,0 calc(100% - 22px));
 background:radial-gradient(60% 80% at 78% 50%,var(--g),transparent 72%),radial-gradient(50% 60% at 0% 0%,rgba(150,200,230,.10),transparent 70%),linear-gradient(165deg,#0f1b27,#08111a 75%)}
.ok{--a:#f3cd7d;--g:rgba(240,185,90,.20);--dim:rgba(243,205,125,.45)}
.code{--a:#8fe9ff;--g:rgba(80,200,235,.17);--dim:rgba(143,233,255,.5)}
.frame,.ring{position:absolute;inset:0;pointer-events:none}
.hatch{position:absolute;left:22px;bottom:0;width:360px;height:7px;opacity:.6;
 background:repeating-linear-gradient(135deg,var(--a) 0 2px,transparent 2px 7px);
 -webkit-mask-image:linear-gradient(90deg,#000,transparent);mask-image:linear-gradient(90deg,#000,transparent)}
.top{position:absolute;left:44px;top:34px;right:80px;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:#8ba3b0;letter-spacing:.12em}
.brand{display:flex;align-items:center;gap:12px}
.st{display:flex;align-items:center;gap:8px;color:var(--a)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a)}
h1{position:absolute;left:44px;top:84px;font-size:62px;font-weight:700;letter-spacing:.1em;line-height:1.2;padding-bottom:6px;
 background:linear-gradient(180deg,#fff 30%,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{position:absolute;left:46px;top:170px;font-size:13px;letter-spacing:.38em;color:var(--dim)}
.rule{position:absolute;left:44px;top:206px;width:420px;height:10px;opacity:.55;
 background:repeating-linear-gradient(90deg,var(--a) 0 1px,transparent 1px 10px);
 -webkit-mask-image:linear-gradient(90deg,#000 20%,transparent);mask-image:linear-gradient(90deg,#000 20%,transparent)}
.rule::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--a);opacity:.7}
.bot{position:absolute;left:44px;bottom:38px;display:flex;align-items:flex-end}
.cell+.cell{margin-left:36px;padding-left:36px;border-left:1px solid rgba(255,255,255,.14)}
.lab{font-size:14px;color:#7e95a2;letter-spacing:.1em;margin-bottom:8px}
.uid{font-size:38px;font-weight:700;letter-spacing:.08em;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.val{font-size:22px;font-weight:700;color:#fff;line-height:1.1}
.cmd{display:inline-block;font:700 32px "DejaVu Sans Mono","Noto Sans CJK SC",monospace;color:var(--a);padding:11px 20px;border-radius:6px;border:1px solid var(--dim);background:linear-gradient(180deg,rgba(143,233,255,.14),rgba(143,233,255,.05));letter-spacing:.03em;line-height:1}
.note{font-size:14px;color:#9db2bd;line-height:1.7;margin-top:2px}
</style></head><body>
