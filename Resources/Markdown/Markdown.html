<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRSS // Markdown</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <style>
        :root {
            --mint: #72f7ce;
            --cyan: #75e8ff;
            --purple: #d7c0ff;
            --pink: #ff9fc9;
            --text: rgba(255, 255, 255, 0.96);
            --text-soft: rgba(230, 240, 255, 0.76);
            --text-dim: rgba(226, 238, 255, 0.60);
            --glass-border: rgba(255, 255, 255, 0.34);
            --glass-highlight: rgba(255, 255, 255, 0.50);
            --shadow: rgba(16, 26, 48, 0.24);
            --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            width: 850px;
            min-height: 100vh;
            padding: 24px;
            overflow: hidden;
            position: relative;
            isolation: isolate;
            color: var(--text-soft);
            background: linear-gradient(145deg, #8aa7c2, #738eae 48%, #91a6be);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        }

        .page-bg {
            position: absolute;
            inset: -45px;
            z-index: 0;
            background-size: cover;
            background-position: center;
            filter: blur(17px) brightness(0.86) saturate(1.08);
            transform: scale(1.04);
            pointer-events: none;
        }

        .page-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 3%, rgba(255,255,255,.34), transparent 35%),
                radial-gradient(circle at 88% 90%, rgba(117,232,255,.20), transparent 42%),
                linear-gradient(145deg, rgba(62,82,114,.08), rgba(18,28,52,.22));
        }

        .main-card {
            position: relative;
            z-index: 1;
            padding: 38px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            border-radius: 36px;
            background: linear-gradient(145deg, rgba(255,255,255,.21), rgba(255,255,255,.09));
            box-shadow:
                inset 0 1px 1px var(--glass-highlight),
                inset 0 -1px 1px rgba(255,255,255,.12),
                0 26px 60px -18px var(--shadow),
                0 8px 20px rgba(16,26,48,.10);
            backdrop-filter: blur(42px) saturate(170%);
            -webkit-backdrop-filter: blur(42px) saturate(170%);
        }

        .card-bg {
            position: absolute;
            inset: -10%;
            z-index: -2;
            opacity: .50;
            background-size: cover;
            background-position: center;
            filter: blur(24px) brightness(.90) saturate(1.08);
            transform: scale(1.08);
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 8% 0%, rgba(255,255,255,.18), transparent 34%),
                linear-gradient(145deg, rgba(21,32,55,.18), rgba(15,25,46,.38));
        }

        .main-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 8%;
            right: 8%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.72), transparent);
            filter: blur(.5px);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 26px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,.16);
        }

        .brand { display: flex; align-items: center; gap: 18px; }

        .brand-icon {
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255,255,255,.38);
            border-radius: 18px;
            color: var(--mint);
            font: 700 21px var(--mono);
            background: linear-gradient(145deg, rgba(255,255,255,.25), rgba(255,255,255,.08));
            box-shadow: inset 0 1px rgba(255,255,255,.58), 0 10px 24px rgba(20,35,60,.15);
            backdrop-filter: blur(22px) saturate(180%);
        }

        .brand h1 { margin: 0; color: var(--text); font-size: 27px; font-weight: 650; letter-spacing: 2.4px; }
        .brand h1 span { color: var(--mint); }
        .brand p { margin: 5px 0 0; color: var(--text-dim); font-size: 10px; letter-spacing: 2.2px; text-transform: uppercase; }

        .date-pill {
            min-width: 128px;
            padding: 11px 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.30);
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
            box-shadow: inset 0 1px rgba(255,255,255,.42), 0 10px 24px rgba(16,28,50,.12);
            backdrop-filter: blur(24px) saturate(180%);
        }

        #date { color: var(--cyan); font: 650 13px var(--mono); }
        .date-label { margin-top: 4px; color: var(--text-dim); font-size: 9px; letter-spacing: 1.5px; }

        .markdown-panel {
            position: relative;
            overflow: hidden;
            padding: 30px 32px;
            border: 1px solid rgba(255,255,255,.27);
            border-radius: 26px;
            background: linear-gradient(145deg, rgba(14,24,43,.38), rgba(12,22,40,.23));
            box-shadow: inset 0 1px rgba(255,255,255,.22), 0 18px 42px rgba(16,28,50,.15);
            backdrop-filter: blur(28px) saturate(165%);
        }

        .markdown-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 9%;
            right: 9%;
            height: 2px;
            z-index: 2;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.66), transparent);
        }

        .markdown-body { position: relative; z-index: 1; line-height: 1.72; word-wrap: break-word; }
        .markdown-body > :first-child { margin-top: 0 !important; }
        .markdown-body > :last-child { margin-bottom: 0 !important; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { color: var(--text); margin: 26px 0 14px; line-height: 1.28; font-weight: 650; }
        .markdown-body h1 { padding-bottom: 12px; font-size: 2em; border-bottom: 1px solid rgba(255,255,255,.16); }
        .markdown-body h2 { font-size: 1.52em; padding-left: 14px; border-left: 4px solid var(--purple); }
        .markdown-body h3 { color: var(--cyan); font-size: 1.24em; }
        .markdown-body p { margin: 0 0 16px; }
        .markdown-body a { color: var(--cyan); text-decoration-color: rgba(117,232,255,.45); }
        .markdown-body ul, .markdown-body ol { margin: 0 0 16px; padding-left: 2em; }
        .markdown-body li { margin: 5px 0; }
        .markdown-body strong { color: var(--text); }
        .markdown-body hr { height: 1px; border: 0; background: rgba(255,255,255,.16); margin: 24px 0; }
        .markdown-body img { max-width: 100%; height: auto; border-radius: 18px; box-shadow: 0 12px 30px rgba(16,28,50,.18); }

        .markdown-body blockquote { margin: 0 0 16px; padding: 13px 18px; color: var(--text-soft); border: 1px solid rgba(255,255,255,.16); border-left: 4px solid var(--pink); border-radius: 14px; background: rgba(255,255,255,.07); }
        .markdown-body blockquote p:last-child { margin-bottom: 0; }

        .markdown-body code { font: 86% var(--mono); color: #ffd1e4; background: rgba(255,255,255,.10); padding: .2em .42em; border-radius: 7px; }
        .markdown-body pre { overflow: auto; margin: 0 0 18px; padding: 18px; border: 1px solid rgba(255,255,255,.18); border-radius: 18px; background: rgba(8,15,29,.46) !important; box-shadow: inset 0 1px rgba(255,255,255,.08); }
        .markdown-body pre code { padding: 0; color: inherit; background: transparent !important; font-size: 100%; }

        .markdown-body table { width: 100%; margin: 0 0 18px; border-spacing: 0; border-collapse: separate; overflow: hidden; border: 1px solid rgba(255,255,255,.18); border-radius: 14px; }
        .markdown-body th, .markdown-body td { padding: 9px 13px; border-right: 1px solid rgba(255,255,255,.14); border-bottom: 1px solid rgba(255,255,255,.14); }
        .markdown-body th { color: var(--text); background: rgba(255,255,255,.10); }
        .markdown-body tr:last-child td { border-bottom: 0; }
        .markdown-body th:last-child, .markdown-body td:last-child { border-right: 0; }
        .markdown-body tr:nth-child(even) td { background: rgba(255,255,255,.035); }

        .footer { display: flex; align-items: center; justify-content: space-between; margin-top: 28px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.16); color: var(--text-dim); font: 11px var(--mono); }
        .footer-info { color: var(--cyan); font-weight: 650; }

        .latency-pill { min-width: 124px; height: 46px; padding: 0 19px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid rgba(255,255,255,.38); border-radius: 999px; color: var(--text); font: 650 14px var(--mono); background: linear-gradient(145deg, rgba(255,255,255,.27), rgba(255,255,255,.10) 50%, rgba(117,232,255,.16)); box-shadow: inset 0 1px rgba(255,255,255,.58), 0 12px 28px rgba(17,29,50,.16); backdrop-filter: blur(24px) saturate(190%); }
        .latency-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 5px var(--mint), 0 0 12px rgba(114,247,206,.70); }
        .latency-dot.offline { background: #ff7b8b; box-shadow: 0 0 5px #ff7b8b, 0 0 12px rgba(255,123,139,.70); }
    </style>
</head>
<body>
    <div class="page-bg" id="pageBg"></div>
    <main class="main-card">
        <div class="card-bg" id="cardBg"></div>
        <div class="card-overlay"></div>

        <header class="header">
            <div class="brand">
                <div class="brand-icon">M↓</div>
                <div>
                    <h1>TRSS <span>//</span> DOCS</h1>
                    <p>Markdown Renderer</p>
                </div>
            </div>
            <div class="date-pill">
                <div id="date">----/--/--</div>
                <div class="date-label">PREVIEW MODE</div>
            </div>
        </header>

        <section class="markdown-panel">
            <article class="markdown-body">{{@Markdown}}</article>
        </section>

        <footer class="footer">
            <div>&lt;/&gt; <span class="footer-info">TRSS-Plugin v3.0.1</span></div>
            <div class="latency-pill">
                <span class="latency-dot{{if baidu_latency === 'TIMEOUT'}} offline{{/if}}"></span>
                <span>{{@baidu_latency}}</span>
            </div>
        </footer>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        const bgData = '{{@background}}';
        if (bgData && bgData !== 'undefined' && bgData.trim() !== '') {
            document.getElementById('pageBg').style.backgroundImage = `url('${bgData}')`;
            document.getElementById('cardBg').style.backgroundImage = `url('${bgData}')`;
        }
        document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
        document.getElementById('date').innerText = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
    </script>
</body>
</html>
