<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JiuLi // Source Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <style>
        :root {
            --mint: #72f7ce;
            --cyan: #75e8ff;
            --purple: #d7c0ff;
            --text: rgba(255,255,255,.96);
            --text-soft: rgba(230,240,255,.76);
            --text-dim: rgba(226,238,255,.60);
            --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            width: fit-content;
            min-width: 850px;
            max-width: 1200px;
            min-height: 100vh;
            padding: 24px;
            overflow: hidden;
            position: relative;
            isolation: isolate;
            background: linear-gradient(145deg, #8aa7c2, #738eae 48%, #91a6be);
            color: var(--text-soft);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        }

        .page-bg {
            position: absolute;
            inset: -45px;
            z-index: 0;
            background-size: cover;
            background-position: center;
            filter: blur(17px) brightness(.86) saturate(1.08);
            transform: scale(1.04);
            pointer-events: none;
        }

        .page-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 3%, rgba(255,255,255,.34), transparent 35%),
                radial-gradient(circle at 88% 90%, rgba(117,232,255,.20), transparent 42%),
                linear-gradient(145deg, rgba(62,82,114,.08), rgba(18,28,52,.22));
        }

        .main-card {
            position: relative;
            z-index: 1;
            min-width: 802px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.34);
            border-radius: 36px;
            background: linear-gradient(145deg, rgba(255,255,255,.21), rgba(255,255,255,.09));
            box-shadow: inset 0 1px 1px rgba(255,255,255,.50), inset 0 -1px 1px rgba(255,255,255,.12), 0 26px 60px -18px rgba(16,26,48,.24), 0 8px 20px rgba(16,26,48,.10);
            backdrop-filter: blur(42px) saturate(170%);
            -webkit-backdrop-filter: blur(42px) saturate(170%);
        }

        .card-bg {
            position: absolute;
            inset: -10%;
            z-index: -2;
            opacity: .50;
            background-size: cover;
            background-position: center;
            filter: blur(24px) brightness(.90) saturate(1.08);
            transform: scale(1.08);
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 8% 0%, rgba(255,255,255,.18), transparent 34%), linear-gradient(145deg, rgba(21,32,55,.18), rgba(15,25,46,.38));
        }

        .main-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 8%;
            right: 8%;
            height: 2px;
            z-index: 3;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.72), transparent);
            filter: blur(.5px);
        }

        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 26px 30px;
            border-bottom: 1px solid rgba(255,255,255,.16);
            background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
        }

        .header-left, .file-info, .footer-left, .footer-item, .status-indicator { display: flex; align-items: center; }
        .header-left { gap: 18px; }
        .file-info { gap: 16px; }
        .footer-left { gap: 17px; }
        .footer-item, .status-indicator { gap: 7px; }

        .logo-icon {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255,255,255,.38);
            border-radius: 18px;
            color: var(--mint);
            font: 700 19px var(--mono);
            background: linear-gradient(145deg, rgba(255,255,255,.25), rgba(255,255,255,.08));
            box-shadow: inset 0 1px rgba(255,255,255,.58), 0 10px 24px rgba(20,35,60,.15);
            backdrop-filter: blur(22px) saturate(180%);
        }

        .title-text h1 { margin: 0; color: var(--text); font-size: 22px; font-weight: 650; letter-spacing: 2.5px; }
        .title-text .accent { color: var(--mint); }
        .title-text .subtitle { margin-top: 5px; color: var(--text-dim); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }

        .window-controls { display: flex; gap: 8px; }
        .control { width: 11px; height: 11px; border-radius: 50%; }
        .red { background: #ff6b64; box-shadow: 0 0 8px rgba(255,107,100,.45); }
        .yellow { background: #ffc545; box-shadow: 0 0 8px rgba(255,197,69,.42); }
        .green { background: #42d65f; box-shadow: 0 0 8px rgba(66,214,95,.42); }

        .file-suffix-badge {
            min-width: 72px;
            padding: 9px 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.34);
            border-radius: 999px;
            color: var(--cyan);
            font: 650 12px var(--mono);
            text-transform: uppercase;
            letter-spacing: 1.4px;
            background: linear-gradient(145deg, rgba(255,255,255,.20), rgba(117,232,255,.09));
            box-shadow: inset 0 1px rgba(255,255,255,.46), 0 8px 20px rgba(16,28,50,.12);
            backdrop-filter: blur(20px) saturate(180%);
        }

        .code-container { padding: 28px 30px; }

        .code-wrapper {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.27);
            border-radius: 26px;
            background: linear-gradient(145deg, rgba(10,19,35,.48), rgba(12,22,40,.30));
            box-shadow: inset 0 1px rgba(255,255,255,.20), 0 18px 42px rgba(16,28,50,.16);
            backdrop-filter: blur(28px) saturate(165%);
        }

        .code-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: 9%;
            right: 9%;
            height: 2px;
            z-index: 3;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.64), transparent);
        }

        .code-visual {
            position: absolute;
            inset: 0;
            z-index: 0;
            opacity: .20;
            background-size: cover;
            background-position: center;
            filter: saturate(1.02) brightness(.76);
            pointer-events: none;
        }

        pre { position: relative; z-index: 1; margin: 0; padding: 22px 8px; white-space: pre-wrap; word-break: break-all; }
        code { color: var(--text) !important; font-family: var(--mono) !important; font-size: 14px !important; line-height: 1.68 !important; background: transparent !important; text-shadow: 0 1px 6px rgba(10,20,36,.36); }
        .hljs { padding: 0 !important; background: transparent !important; }

        .hljs-ln-numbers { padding: 0 18px !important; text-align: right; vertical-align: top; color: rgba(114,247,206,.45) !important; border-right: 1px solid rgba(255,255,255,.14) !important; font-size: 13px !important; user-select: none; }
        .hljs-ln-code { padding-left: 20px !important; }
        .hljs-ln tr:hover { background: rgba(255,255,255,.035) !important; }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 30px;
            border-top: 1px solid rgba(255,255,255,.16);
            color: var(--text-dim);
            font: 11px var(--mono);
            background: rgba(255,255,255,.035);
        }

        .footer-item .icon, .status-indicator .dot { color: var(--mint); }
        .footer-item .value { color: var(--cyan); }
        .status-indicator .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 10px rgba(114,247,206,.66); }

        .latency-pill {
            min-width: 124px;
            height: 44px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,.38);
            border-radius: 999px;
            color: var(--text);
            font: 650 13px var(--mono);
            background: linear-gradient(145deg, rgba(255,255,255,.27), rgba(255,255,255,.10) 50%, rgba(117,232,255,.16));
            box-shadow: inset 0 1px rgba(255,255,255,.58), 0 12px 28px rgba(17,29,50,.16);
            backdrop-filter: blur(24px) saturate(190%);
        }

        .latency-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 5px var(--mint), 0 0 12px rgba(114,247,206,.70); }
        .latency-dot.offline { background: #ff7b8b; box-shadow: 0 0 5px #ff7b8b, 0 0 12px rgba(255,123,139,.70); }
    </style>
</head>
<body>
    <div class="page-bg" id="pageBg"></div>
    <main class="main-card">
        <div class="card-bg" id="cardBg"></div>
        <div class="card-overlay"></div>

        <header class="window-header">
            <div class="header-left">
                <div class="logo-icon">{ }</div>
                <div class="title-text">
                    <h1>SOURCE <span class="accent">//</span> VIEWER</h1>
                    <div class="subtitle">JiuLi-Plugin Code Analyzer</div>
                </div>
            </div>
            <div class="file-info">
                <div class="window-controls">
                    <span class="control red"></span><span class="control yellow"></span><span class="control green"></span>
                </div>
                <span class="file-suffix-badge">{{fileSuffix}}</span>
            </div>
        </header>

        <section class="code-container">
            <div class="code-wrapper">
                <div class="code-visual" id="codeVisual"></div>
                <pre><code class="hljs" data-ln-start-from="{{lnStart}}">{{@SourceCode}}</code></pre>
            </div>
        </section>

        <footer class="footer">
            <div class="footer-left">
                <div class="footer-item"><span class="icon">&lt;/&gt;</span><span>JiuLi-Plugin v3.0.1</span></div>
                <div class="footer-item"><span class="value">{{fileSuffix}}</span><span>FILE</span></div>
                <div class="status-indicator"><span class="dot"></span><span>READY</span></div>
            </div>
            <div class="latency-pill">
                <span class="latency-dot{{if baidu_latency === 'TIMEOUT'}} offline{{/if}}"></span>
                <span>{{@baidu_latency}}</span>
            </div>
        </footer>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.js"></script>
    <script>
        const bgData = '{{@bgData}}';
        if (bgData && bgData !== 'undefined' && bgData.trim() !== '') {
            for (const id of ['pageBg', 'cardBg', 'codeVisual']) {
                document.getElementById(id).style.backgroundImage = `url('${bgData}')`;
            }
        }

        const suffix = '{{fileSuffix}}';
        if (hljs.getLanguage(suffix)) document.querySelector('code').classList.add('language-' + suffix);
        hljs.highlightAll();
        hljs.initLineNumbersOnLoad();
    </script>
</body>
</html>
